[project]
name = "pregen-registry"
version = "0.1.0"
description = "Reference PRE-GEN registry: ask before you generate, get a signed answer anyone can check."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["pregen>=0.9.1", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42", "jsonschema>=4.21"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pregen-registry = "pregen_registry.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pregen_registry"]

[tool.setuptools.package-data]
pregen_registry = ["schemas/*.json"]
